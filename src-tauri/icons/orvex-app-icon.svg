<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ORVEX STUDIOS">
  <defs>
    <radialGradient id="bg" cx="68%" cy="24%" r="92%">
      <stop offset="0" stop-color="#172b42"/>
      <stop offset="0.5" stop-color="#07101b"/>
      <stop offset="1" stop-color="#020407"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75c5ff"/>
      <stop offset="0.58" stop-color="#d5edff"/>
      <stop offset="1" stop-color="#ff8b3d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="42" y="42" width="940" height="940" rx="224" fill="url(#bg)" stroke="#263d55" stroke-width="8"/>
  <circle cx="512" cy="450" r="208" fill="none" stroke="#dcecff" stroke-width="48" opacity="0.96"/>
  <ellipse cx="512" cy="450" rx="340" ry="135" fill="none" stroke="url(#orbit)" stroke-width="24" transform="rotate(-16 512 450)" filter="url(#glow)"/>
  <circle cx="805" cy="333" r="24" fill="#ff984f" filter="url(#glow)"/>
  <text x="512" y="794" text-anchor="middle" fill="#f3f8fd" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="22">ORVEX</text>
  <text x="512" y="858" text-anchor="middle" fill="#74bdf3" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="18">STUDIOS</text>
